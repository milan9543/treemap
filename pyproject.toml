[project]
name = "treemap"
version = "0.1.0"
description = "3D/2D mapping and position-aware effects for a WLED Christmas tree"
readme = "ROADMAP.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.31",
    "websockets>=12.0",
]

[project.scripts]
treemap = "treemap.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

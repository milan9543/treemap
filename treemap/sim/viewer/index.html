<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>treemap viewer</title>
<style>
  :root {
    --bg: #07090d;
    --panel: rgba(18, 22, 30, 0.86);
    --border: rgba(255, 255, 255, 0.08);
    --field: rgba(255, 255, 255, 0.05);
    --text: #d8dee9;
    --muted: #7b8494;
    --accent: #7fd1a8;
    --warn: #f0c36a;
    --bad: #ef7d7d;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow: auto; }
  #left { position: fixed; top: 12px; left: 12px; width: 300px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; gap: 10px; }
  #left .panel { flex: none; }
  #left #fx { flex: 0 1 auto; min-height: 0; }
  #gen { position: fixed; top: 12px; right: 12px; width: 384px; max-height: calc(100vh - 24px); }
  @media (max-width: 760px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; max-height: 46vh; }
    #gen { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46vh; }
  }
  h1, h2 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  button { background: var(--field); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
  button.active { background: rgba(127, 209, 168, 0.18); color: var(--accent); }
  button.primary { background: rgba(127, 209, 168, 0.22); color: var(--accent); border-color: rgba(127, 209, 168, 0.35); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: rgba(127, 209, 168, 0.32); }
  button.icon { padding: 2px 7px; line-height: 1.2; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  kbd { font: 11px var(--mono); color: var(--muted); margin-left: 4px; }
  #info { margin-top: 6px; font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; }
  #warn { margin-top: 8px; color: var(--warn); display: none; }
  #tip { position: fixed; pointer-events: none; display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font: 12px var(--mono); white-space: nowrap; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; pointer-events: none; }

  /* generator form */
  input, select { background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; font: inherit; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--muted); opacity: 0.8; }
  input[type=number] { font-family: var(--mono); font-size: 12px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  .section { margin-top: 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 2px 3px; }
  td { padding: 2px 3px; vertical-align: middle; }
  td.num { width: 18px; color: var(--muted); font: 12px var(--mono); }
  td.spacing { font: 12px var(--mono); color: var(--muted); white-space: nowrap; width: 58px; }
  #strips input.leds { width: 62px; }
  #strips input.length { width: 68px; }
  #strips select { width: 84px; }
  td.spacing.bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 4px; }
  .grid label, label.check { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 12px; }
  label.check { flex-direction: row; align-items: center; gap: 6px; margin-top: 8px; color: var(--text); }
  #total { font: 12px var(--mono); color: var(--muted); }
  #total.warn, #g-status.warn { color: var(--warn); }
  #g-status { margin-top: 8px; min-height: 1.2em; font-size: 12px; color: var(--muted); }
  #g-status.bad { color: var(--bad); }
  #g-warnings { margin: 6px 0 0; padding-left: 16px; color: var(--warn); font-size: 12px; }
  #g-warnings:empty { display: none; }
  #gen.collapsed #gen-body, #fx.collapsed #fx-body { display: none; }

  /* effects panel */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .chips button { padding: 3px 9px; font-size: 12px; border-radius: 999px; }
  .chips button.running { background: rgba(127, 209, 168, 0.22); color: var(--accent); border-color: rgba(127, 209, 168, 0.45); }
  #fx-params { margin-top: 10px; display: grid; gap: 7px; }
  #fx-params:empty { display: none; }
  .ctl { display: grid; grid-template-columns: 82px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ctl output { font: 11px var(--mono); text-align: right; color: var(--text); }
  .ctl input[type=range] { padding: 0; accent-color: var(--accent); }
  .ctl input[type=color] { padding: 0 2px; height: 24px; cursor: pointer; }
  .ctl input[type=checkbox] { justify-self: start; }
  #fx-desc { margin-top: 8px; font-size: 12px; color: var(--muted); }
  #fx-desc:empty { display: none; }
  #fx-status { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 1.2em; }
  #fx-status.bad { color: var(--bad); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="left">
<div id="panel" class="panel">
  <h1><span id="conn" class="dot" title="viewer connection"></span>treemap <span class="muted" id="fps"></span></h1>
  <div id="info" class="muted">loading…</div>
  <div class="row">
    <div class="seg">
      <button id="mode-truth" class="active" title="Ground-truth positions (t)">Truth</button>
      <button id="mode-scan" title="Reconstructed positions from tree_map.json (t)">Scanned</button>
    </div>
    <button id="reset" title="Reset camera (r)">Reset<kbd>r</kbd></button>
  </div>
  <div class="row">
    <button id="t-off" class="active" title="Show unlit LEDs as small dots">Unlit<kbd>o</kbd></button>
    <button id="t-cone" class="active" title="Show the cone and trunk">Cone<kbd>c</kbd></button>
    <button id="t-wire" title="Show the wire path in index order">Wire<kbd>w</kbd></button>
  </div>
  <div id="warn"></div>
</div>

<section id="fx" class="panel">
  <div class="head">
    <h2>Effects <span id="fx-out" class="muted" style="font-weight: 400"></span></h2>
    <button id="fx-toggle" class="icon" title="Show or hide the effects" aria-expanded="true">hide</button>
  </div>
  <div id="fx-body">
    <div id="fx-list"></div>
    <div id="fx-desc"></div>
    <div id="fx-params"></div>
    <div class="ctl" style="margin-top: 10px">
      <span>Brightness</span>
      <input type="range" id="fx-bright" min="0" max="100" step="1" value="80" aria-label="Brightness">
      <output id="fx-bright-val">80%</output>
    </div>
    <div class="row">
      <button id="fx-stop" title="Stop the effect and turn the LEDs off">Stop</button>
    </div>
    <div id="fx-status"></div>
  </div>
</section>
</div>

<aside id="gen" class="panel">
  <div class="head">
    <h2>Tree</h2>
    <button id="gen-toggle" class="icon" title="Show or hide the tree settings" aria-expanded="true">hide</button>
  </div>
  <div id="gen-body">
    <div class="section">Strips, in index order</div>
    <table>
      <thead><tr><th></th><th>LEDs</th><th>Length m</th><th>Spacing</th><th>Index 0</th><th></th></tr></thead>
      <tbody id="strips"></tbody>
    </table>
    <div class="row" style="justify-content: space-between">
      <button id="add-strip">+ Strip</button>
      <span id="total"></span>
    </div>

    <div class="section">Tree</div>
    <div class="grid">
      <label>Height m <input id="g-height" type="number" step="0.05" min="0.3" max="5"></label>
      <label>Radius m <input id="g-radius" type="number" step="0.05" min="0.1" max="2.5"></label>
      <label>Layout
        <select id="g-layout">
          <option value="auto">auto</option>
          <option value="interleaved">interleaved</option>
          <option value="stacked">stacked</option>
        </select>
      </label>
      <label>Seed <input id="g-seed" type="number" min="0" step="1" placeholder="random"></label>
    </div>
    <label class="check" title="Let 'auto' settings pick quirks at random: strips indexed from the top, stacked layout">
      <input type="checkbox" id="g-quirks" checked> Random wiring quirks for "auto"
    </label>
    <div class="row">
      <button id="generate" class="primary">Generate</button>
      <button id="g-defaults" title="Reset the form to the sim section of config.yaml">Config defaults</button>
    </div>
    <div id="g-status"></div>
    <ul id="g-warnings"></ul>
  </div>
</aside>

<div id="tip"></div>
<div id="empty"><div>No simulated tree yet.<br><br>Set up the strips in the Tree panel and press Generate.</div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- scene setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x07090d);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const ground = new THREE.PolarGridHelper(1.2, 8, 6, 64, 0x1c2430, 0x141a22);
scene.add(ground);

const decor = new THREE.Group();   // cone + trunk
scene.add(decor);

// LED points: additive glow sprite drawn in a shader so size is in world metres.
const ledMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uSize: { value: 0.09 },        // halo diameter in metres
    uScale: { value: 1.0 },        // pixels per metre at distance 1, set on resize
    uOffDots: { value: 1.0 },
  },
  vertexShader: /* glsl */`
    attribute vec3 ledColor;
    uniform float uSize, uScale;
    varying vec3 vColor;
    void main() {
      vColor = ledColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(2.0, uSize * uScale / -mv.z);
    }`,
  fragmentShader: /* glsl */`
    uniform float uOffDots;
    varying vec3 vColor;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float d2 = dot(p, p);
      if (d2 > 1.0) discard;
      float lum = max(vColor.r, max(vColor.g, vColor.b));
      float core = exp(-d2 * 60.0);
      float halo = exp(-d2 * 6.0) * 0.55;
      vec3 c = vColor * (core * 1.4 + halo) + vec3(core * lum * 0.7);
      float dotMask = (1.0 - smoothstep(0.09, 0.16, sqrt(d2))) * uOffDots * (1.0 - min(lum * 4.0, 1.0));
      c += vec3(0.22, 0.25, 0.3) * dotMask;
      gl_FragColor = vec4(c, 1.0);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

let points = null, wire = null;
let ledCount = 0;
let colors = new Float32Array(0);
let truthPos = null, scanPos = null, tree = null, map = null, serverConfig = null;
let mode = "truth";
let lastFrame = null;

// ---------------------------------------------------------------- data loading
async function fetchJson(url) {
  try {
    const r = await fetch(url, { cache: "no-store" });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

let formFilled = false;
async function loadAll() {
  [tree, map] = await Promise.all([fetchJson("/api/tree"), fetchJson("/api/map")]);
  if (tree && tree.version !== 2) tree = null;  // old format: wait for a regenerate
  truthPos = tree ? Float32Array.from(tree.positions.flat()) : null;
  scanPos = map && map.positions ? scanToWorld(map.positions) : null;
  if (!truthPos && scanPos) mode = "scan";
  if (!scanPos) mode = "truth";
  $("empty").style.display = truthPos || scanPos ? "none" : "flex";
  $("mode-scan").disabled = !scanPos;
  $("mode-truth").disabled = !truthPos;
  rebuild();
  if (!formFilled) {
    if (tree && tree.spec) fillForm(tree.spec);
    else if (serverConfig) fillForm(serverConfig.defaults);
    formFilled = !!(tree || serverConfig);
  }
  showTreeWarnings();
}

// tree_map.json is normalised (y 0..1 over the LEDs, x/z centred on the trunk at the same
// scale). Stretch it onto the ground truth's LED height range so the two overlay.
function scanToWorld(pos) {
  let y0 = 0, y1 = 1.8;
  if (tree) {
    const ys = tree.positions.map((p) => p[1]);
    y0 = Math.min(...ys); y1 = Math.max(...ys);
  }
  const s = y1 - y0;
  const out = new Float32Array(pos.length * 3);
  pos.forEach((p, i) => {
    const ok = p && p.every(Number.isFinite);
    out[i * 3] = ok ? p[0] * s : NaN;
    out[i * 3 + 1] = ok ? y0 + p[1] * s : NaN;
    out[i * 3 + 2] = ok ? p[2] * s : NaN;
  });
  return out;
}

function rebuild() {
  if (points) { scene.remove(points); points.geometry.dispose(); points = null; }
  if (wire) { scene.remove(wire); wire.traverse((o) => o.geometry && o.geometry.dispose()); wire = null; }
  decor.traverse((o) => o.geometry && o.geometry.dispose());
  decor.clear();
  const pos = mode === "truth" ? truthPos : scanPos;
  if (!pos) { updateInfo(); return; }

  ledCount = pos.length / 3;
  colors = new Float32Array(ledCount * 3);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geom.setAttribute("ledColor", new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage));
  // Failed LEDs in a scanned map are NaN; a fixed bound keeps raycasting working.
  geom.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 1, 0), 10);
  points = new THREE.Points(geom, ledMaterial);
  points.frustumCulled = false;
  scene.add(points);

  // Wire path, one polyline per strip (scanned maps have no strip info: one line).
  wire = new THREE.Group();
  const strands = tree ? tree.strands : [{ start: 0, count: ledCount }];
  const hues = [0.33, 0.58, 0.08, 0.83, 0.15, 0.5, 0.95, 0.7];
  strands.forEach((s, k) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos.slice(s.start * 3, (s.start + s.count) * 3), 3));
    const m = new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(hues[k % hues.length], 0.6, 0.55), transparent: true, opacity: 0.35 });
    wire.add(new THREE.Line(g, m));
  });
  wire.visible = $("t-wire").classList.contains("active");
  scene.add(wire);

  const H = tree ? tree.height : 1.8, R = tree ? tree.radius : 0.6;
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(R, H, 64, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x2f6b46, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
  cone.position.y = H / 2;
  const coneEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.ConeGeometry(R, H, 24, 1, true)),
    new THREE.LineBasicMaterial({ color: 0x2f6b46, transparent: true, opacity: 0.12 }));
  coneEdges.position.y = H / 2;
  const tr = tree ? tree.trunk_radius : 0.04;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(tr * 0.6, tr, H, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x5a3d26, transparent: true, opacity: 0.18, depthWrite: false }));
  trunk.position.y = H / 2;
  decor.add(cone, coneEdges, trunk);
  decor.visible = $("t-cone").classList.contains("active");
  ground.scale.setScalar(Math.max(R * 1.6, 0.6));

  if (!controls.userMoved || controls.lastHeight !== H) resetView();
  if (lastFrame) applyFrame(lastFrame);
  updateInfo();
}

function resetView() {
  const H = tree ? tree.height : 1.8;
  const dist = (H * 0.72) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  controls.target.set(0, H * 0.45, 0);
  camera.position.set(0, H * 0.7, dist);
  controls.update();
  controls.userMoved = false;
  controls.lastHeight = H;
}
controls.addEventListener("start", () => { controls.userMoved = true; });

function updateInfo() {
  const lines = [];
  if (tree) {
    lines.push(`seed ${tree.seed} · ${tree.led_count} LEDs · ${tree.layout}`);
    lines.push(`h ${tree.height.toFixed(2)} m · r ${tree.radius.toFixed(2)} m`);
    tree.strands.forEach((s, i) => lines.push(
      `strip ${i + 1}: ${s.start}–${s.start + s.count - 1} · ${(s.spacing * 100).toFixed(1)} cm · ` +
      `${s.turns.toFixed(1)} turns${s.index_from_top ? " · from top" : ""}`));
  }
  lines.push(map ? `scanned map: ${map.positions.length} LEDs` : "scanned map: none yet");
  $("info").textContent = lines.join("\n");
  $("mode-truth").classList.toggle("active", mode === "truth");
  $("mode-scan").classList.toggle("active", mode === "scan");
}

// ---------------------------------------------------------------- live frames
function applyFrame(buf) {
  const bytes = new Uint8Array(buf);
  const n = Math.min(bytes.length, colors.length);
  for (let i = 0; i < n; i++) colors[i] = bytes[i] / 255;
  for (let i = n; i < colors.length; i++) colors[i] = 0;
  if (points) points.geometry.attributes.ledColor.needsUpdate = true;
  const w = $("warn");
  if (ledCount && bytes.length !== ledCount * 3) {
    w.textContent = `Frames have ${bytes.length / 3} LEDs but the tree has ${ledCount}. ` +
      `Match led_count in config.yaml to the strips.`;
    w.style.display = "block";
  } else {
    w.style.display = "none";
  }
}

let frameCount = 0, producers = 0;
setInterval(() => {
  $("fps").textContent = producers ? `${frameCount} fps` : "idle";
  frameCount = 0;
}, 1000);

let ws = null;
const pending = new Map();  // generate request id -> resolve
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/viewer`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => $("conn").classList.add("on");
  ws.onclose = () => {
    $("conn").classList.remove("on");
    for (const resolve of pending.values()) resolve({ ok: false, error: "lost connection to the server" });
    pending.clear();
    setTimeout(connect, 1000);
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "reload") loadAll();
      else if (msg.type === "status") producers = msg.producers;
      else if (msg.type === "engine") onEngineState(msg);
      else if (msg.type === "effect.error") fxStatus(msg.error, "bad");
      else if (msg.type === "generated" && pending.has(msg.id)) {
        pending.get(msg.id)(msg);
        pending.delete(msg.id);
      }
      return;
    }
    lastFrame = ev.data;
    frameCount++;
    applyFrame(ev.data);
  };
}

// ---------------------------------------------------------------- generator form
const LIMITS_FALLBACK = { leds: [1, 2000], strips: [1, 8], total_leds: [1, 5000], spacing: [0.01, 0.5] };
const limits = () => (serverConfig && serverConfig.limits) || LIMITS_FALLBACK;

function stripRow(strip) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="num"></td>
    <td><input type="number" class="leds" min="1" step="1" title="Number of LEDs on this strip"></td>
    <td><input type="number" class="length" min="0.1" step="0.1" placeholder="random" title="Metres of strip; blank = random 6.5–8 cm spacing"></td>
    <td class="spacing"></td>
    <td><select class="start" title="Which end of the strip is index 0">
      <option value="auto">auto</option><option value="bottom">bottom</option><option value="top">top</option>
    </select></td>
    <td><button class="icon remove" title="Remove this strip" aria-label="Remove strip">×</button></td>`;
  tr.querySelector(".leds").value = strip.leds;
  tr.querySelector(".length").value = strip.length ?? "";
  tr.querySelector(".start").value = strip.start || "auto";
  tr.querySelector(".remove").onclick = () => { tr.remove(); refreshForm(); };
  tr.querySelectorAll("input, select").forEach((el) => el.addEventListener("input", refreshForm));
  return tr;
}

function readStrips() {
  return [...$("strips").children].map((tr) => {
    const leds = parseInt(tr.querySelector(".leds").value, 10);
    const lenText = tr.querySelector(".length").value.trim();
    return { leds, length: lenText === "" ? null : parseFloat(lenText), start: tr.querySelector(".start").value };
  });
}

function refreshForm() {
  const rows = [...$("strips").children];
  const strips = readStrips();
  const [smin, smax] = limits().spacing;
  rows.forEach((tr, i) => {
    tr.querySelector(".num").textContent = i + 1;
    tr.querySelector(".remove").disabled = rows.length <= 1;
    const s = strips[i], cell = tr.querySelector(".spacing");
    if (!Number.isFinite(s.leds) || s.leds < 1) { cell.textContent = "–"; cell.classList.add("bad"); return; }
    if (s.length === null) { cell.textContent = "random"; cell.classList.remove("bad"); return; }
    const sp = s.length / s.leds;
    cell.textContent = Number.isFinite(sp) ? `${(sp * 100).toFixed(1)} cm` : "–";
    cell.classList.toggle("bad", !(sp >= smin && sp <= smax));
    cell.title = cell.classList.contains("bad") ? `spacing must be ${smin * 100}–${smax * 100} cm` : "";
  });
  $("add-strip").disabled = rows.length >= limits().strips[1];
  const total = strips.reduce((a, s) => a + (Number.isFinite(s.leds) ? s.leds : 0), 0);
  const cfgCount = serverConfig ? serverConfig.led_count : null;
  const t = $("total");
  t.textContent = `${total} LEDs` + (cfgCount !== null && cfgCount !== total ? ` · config has ${cfgCount}` : "");
  t.classList.toggle("warn", cfgCount !== null && cfgCount !== total);
  t.title = t.classList.contains("warn")
    ? `led_count in config.yaml is ${cfgCount}: test patterns and effects will drive ${cfgCount} LEDs` : "";
}

function fillForm(spec) {
  const body = $("strips");
  body.innerHTML = "";
  (spec.strips || []).forEach((s) => body.appendChild(stripRow(s)));
  $("g-height").value = spec.height ?? "";
  $("g-radius").value = spec.radius ?? "";
  $("g-layout").value = spec.layout || "auto";
  $("g-quirks").checked = spec.quirks !== false;
  $("g-seed").value = "";  // blank = a new random tree each time
  refreshForm();
  updatePlaceholders();
}

function updatePlaceholders() {
  const rnd = serverConfig && serverConfig.random;
  const fmt = (r) => (r ? `random ${r[0]}–${r[1]}` : "random");
  $("g-height").placeholder = tree ? `random (now ${tree.height.toFixed(2)})` : fmt(rnd && rnd.height);
  $("g-radius").placeholder = tree ? `random (now ${tree.radius.toFixed(2)})` : fmt(rnd && rnd.radius);
  $("g-seed").placeholder = tree ? `random (now ${tree.seed})` : "random";
}

function showTreeWarnings() {
  const ul = $("g-warnings");
  ul.innerHTML = "";
  (tree && tree.warnings || []).forEach((w) => {
    const li = document.createElement("li");
    li.textContent = w;
    ul.appendChild(li);
  });
  updatePlaceholders();
}

function setStatus(text, kind = "") {
  const s = $("g-status");
  s.textContent = text;
  s.className = kind;
}

function num(id) {
  const v = $(id).value.trim();
  return v === "" ? null : Number(v);
}

let requestId = 0;
async function generate() {
  const strips = readStrips();
  if (strips.some((s) => !Number.isInteger(s.leds) || s.leds < 1)) {
    setStatus("Every strip needs a whole number of LEDs.", "bad");
    return;
  }
  const spec = {
    strips,
    height: num("g-height"),
    radius: num("g-radius"),
    layout: $("g-layout").value,
    quirks: $("g-quirks").checked,
    seed: num("g-seed"),
  };
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    setStatus("Not connected to the server. Is `treemap sim view` running?", "bad");
    return;
  }
  const id = ++requestId;
  const btn = $("generate");
  btn.disabled = true;
  setStatus("Generating…");
  const reply = await new Promise((resolve) => {
    pending.set(id, resolve);
    ws.send(JSON.stringify({ type: "generate", id, spec }));
  });
  btn.disabled = false;
  if (reply.ok) {
    setStatus(`Generated seed ${reply.seed}: ${reply.led_count} LEDs.` +
      (reply.warnings.length ? " See the warnings below." : ""), reply.warnings.length ? "warn" : "");
  } else {
    setStatus(reply.error, "bad");
  }
}

$("add-strip").onclick = () => {
  const strips = readStrips();
  const last = strips[strips.length - 1] || { leds: 200, length: null, start: "auto" };
  $("strips").appendChild(stripRow({ ...last, start: "auto" }));
  refreshForm();
};
$("generate").onclick = generate;
$("g-defaults").onclick = () => { if (serverConfig) fillForm(serverConfig.defaults); setStatus(""); };
$("gen-body").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("input") && !$("generate").disabled) generate();
});

function collapsible(panelId, toggleId, key) {
  const set = (c) => {
    $(panelId).classList.toggle("collapsed", c);
    $(toggleId).textContent = c ? "show" : "hide";
    $(toggleId).setAttribute("aria-expanded", String(!c));
    try { localStorage.setItem(key, c ? "1" : "0"); } catch {}
  };
  $(toggleId).onclick = () => set(!$(panelId).classList.contains("collapsed"));
  try { set(localStorage.getItem(key) === "1"); } catch {}
}
collapsible("gen", "gen-toggle", "treemap.genCollapsed");
collapsible("fx", "fx-toggle", "treemap.fxCollapsed");

// ---------------------------------------------------------------- effects panel
let effects = [];               // descriptions from /api/effects
let engine = { running: null, params: null, brightness: 0.8 };
const remembered = {};          // effect name -> last params used, so re-firing keeps tweaks
let shownParamsFor = null;      // effect whose controls are currently built

function send(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    fxStatus("Not connected to the server. Is `treemap sim view` running?", "bad");
    return false;
  }
  ws.send(JSON.stringify(msg));
  return true;
}

function fxStatus(text, kind = "") {
  const s = $("fx-status");
  s.textContent = text;
  s.className = kind;
}

// At most one message per `ms`, always sending the latest value last.
function throttled(ms, fn) {
  let last = 0, timer = null, pendingArgs = null;
  return (...args) => {
    pendingArgs = args;
    const wait = last + ms - Date.now();
    if (wait <= 0) { last = Date.now(); fn(...pendingArgs); }
    else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); fn(...pendingArgs); }, wait);
  };
}

function buildEffects(info) {
  effects = info && info.effects || [];
  const list = $("fx-list");
  list.innerHTML = "";
  if (!info || !info.available) {
    list.innerHTML = '<div class="muted">Effects aren\'t available from this server.</div>';
    return;
  }
  $("fx-out").textContent = `→ ${info.output}`;
  const groups = [...new Set(effects.map((e) => e.group))];
  for (const g of groups) {
    const head = document.createElement("div");
    head.className = "section";
    head.textContent = g;
    const chips = document.createElement("div");
    chips.className = "chips";
    effects.filter((e) => e.group === g).forEach((e) => {
      const b = document.createElement("button");
      b.textContent = e.label;
      b.title = e.description;
      b.dataset.effect = e.name;
      b.onclick = () => runEffect(e.name);
      chips.appendChild(b);
    });
    list.append(head, chips);
  }
}

function runEffect(name) {
  if (send({ type: "effect.run", effect: name, params: remembered[name] || {} })) fxStatus("");
}

const sendParams = throttled(60, (params) => send({ type: "effect.params", params }));
const sendBrightness = throttled(60, (value) => send({ type: "effect.brightness", value }));

function paramControl(p, value) {
  const row = document.createElement("label");
  row.className = "ctl";
  row.title = p.help || "";
  const name = document.createElement("span");
  name.textContent = p.label;
  const out = document.createElement("output");
  let input;
  const changed = (v) => {
    remembered[engine.running] = { ...(remembered[engine.running] || {}), [p.name]: v };
    sendParams({ [p.name]: v });
  };
  if (p.kind === "color") {
    input = document.createElement("input");
    input.type = "color";
    input.value = value;
    input.oninput = () => changed(input.value);
  } else if (p.kind === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!value;
    input.onchange = () => changed(input.checked);
  } else if (p.kind === "choice") {
    input = document.createElement("select");
    p.choices.forEach((c) => input.add(new Option(c, c)));
    input.value = value;
    input.onchange = () => changed(input.value);
  } else {
    input = document.createElement("input");
    input.type = "range";
    input.min = p.min; input.max = p.max;
    input.step = p.step ?? (p.kind === "int" ? 1 : "any");
    input.value = value;
    const fmt = (v) => (p.kind === "int" ? String(v) : (+v).toFixed(p.step && p.step < 0.1 ? 2 : 1));
    out.textContent = fmt(value);
    input.oninput = () => {
      const v = p.kind === "int" ? parseInt(input.value, 10) : parseFloat(input.value);
      out.textContent = fmt(v);
      changed(v);
    };
  }
  input.dataset.param = p.name;
  input.setAttribute("aria-label", p.label);
  row.append(name, input, out);
  return row;
}

function syncControl(input, p, value) {
  if (document.activeElement === input) return;  // don't fight the user's drag
  if (p.kind === "bool") input.checked = !!value;
  else input.value = value;
  const out = input.parentElement.querySelector("output");
  if (out && input.type === "range") out.textContent = p.kind === "int" ? String(value) : (+value).toFixed(p.step && p.step < 0.1 ? 2 : 1);
}

function onEngineState(st) {
  engine = st;
  document.querySelectorAll("#fx-list button").forEach((b) =>
    b.classList.toggle("running", b.dataset.effect === st.running));
  const desc = effects.find((e) => e.name === st.running);
  $("fx-desc").textContent = desc ? desc.description : "";
  const box = $("fx-params");
  if (!desc) {
    box.innerHTML = "";
    shownParamsFor = null;
  } else if (shownParamsFor !== st.running) {
    box.innerHTML = "";
    desc.params.forEach((p) => box.appendChild(paramControl(p, st.params[p.name])));
    shownParamsFor = st.running;
  } else {
    desc.params.forEach((p) => {
      const input = box.querySelector(`[data-param="${p.name}"]`);
      if (input) syncControl(input, p, st.params[p.name]);
    });
  }
  if (st.running) remembered[st.running] = { ...st.params };
  const bright = $("fx-bright");
  if (document.activeElement !== bright) {
    bright.value = Math.round(st.brightness * 100);
    $("fx-bright-val").textContent = `${bright.value}%`;
  }
  $("fx-stop").disabled = !st.running;
  if (st.error) fxStatus(st.error, "bad");
  else if (st.running) fxStatus(`Running ${desc ? desc.label : st.running}`);
  else if (!$("fx-status").classList.contains("bad")) fxStatus("Stopped");
}

$("fx-bright").oninput = () => {
  $("fx-bright-val").textContent = `${$("fx-bright").value}%`;
  sendBrightness($("fx-bright").value / 100);
};
$("fx-stop").onclick = () => send({ type: "effect.stop" });
$("fx-stop").disabled = true;

// ---------------------------------------------------------------- interaction
function setMode(m) { if ((m === "scan" ? scanPos : truthPos) && m !== mode) { mode = m; rebuild(); } }
function toggle(id, apply) { const b = $(id); b.classList.toggle("active"); apply(b.classList.contains("active")); }
const toggles = {
  o: () => toggle("t-off", (on) => { ledMaterial.uniforms.uOffDots.value = on ? 1 : 0; }),
  c: () => toggle("t-cone", (on) => { decor.visible = on; }),
  w: () => toggle("t-wire", (on) => { if (wire) wire.visible = on; }),
};
$("mode-truth").onclick = () => setMode("truth");
$("mode-scan").onclick = () => setMode("scan");
$("reset").onclick = resetView;
$("t-off").onclick = toggles.o;
$("t-cone").onclick = toggles.c;
$("t-wire").onclick = toggles.w;
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input, select, textarea")) return;  // typing in the form
  if (e.key === "t") setMode(mode === "truth" ? "scan" : "truth");
  else if (e.key === "r") resetView();
  else if (toggles[e.key]) toggles[e.key]();
});

// Hover: show LED index, strip and colour.
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.025;
const mouse = new THREE.Vector2();
let hoverEvent = null;
renderer.domElement.addEventListener("pointermove", (e) => { hoverEvent = e; });
renderer.domElement.addEventListener("pointerleave", () => { hoverEvent = null; $("tip").style.display = "none"; });

function updateHover() {
  const tip = $("tip");
  if (!hoverEvent || !points) { tip.style.display = "none"; return; }
  mouse.set((hoverEvent.clientX / window.innerWidth) * 2 - 1, -(hoverEvent.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObject(points)[0];
  if (!hit) { tip.style.display = "none"; return; }
  const i = hit.index;
  const strip = tree ? tree.strands.findIndex((s) => i >= s.start && i < s.start + s.count) : -1;
  const rgb = [0, 1, 2].map((k) => Math.round(colors[i * 3 + k] * 255)).join(", ");
  tip.textContent = `#${i}${strip >= 0 ? ` · strip ${strip + 1}` : ""} · rgb(${rgb})`;
  tip.style.left = `${hoverEvent.clientX + 14}px`;
  tip.style.top = `${hoverEvent.clientY + 14}px`;
  tip.style.display = "block";
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  ledMaterial.uniforms.uScale.value =
    renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
window.addEventListener("resize", onResize);
onResize();

renderer.setAnimationLoop(() => {
  controls.update();
  updateHover();
  renderer.render(scene, camera);
});

[serverConfig] = await Promise.all([
  fetchJson("/api/config"),
  fetchJson("/api/effects").then(buildEffects),
]);
await loadAll();
connect();
</script>
</body>
</html>

# treemap configuration. Every key is optional; missing keys use the defaults shown here.
# Relative paths are resolved against the directory containing this file.

led_count: 400

# Where colours go: "sim" (browser viewer) or "wled" (DDP over UDP to the controllers below).
output: sim

# WLED controllers. Each one owns a contiguous slice [start, start + count) of the global
# LED index. "reverse" flips the order within that slice (strand wired from the other end).
controllers:
  - host: wled-tree.local
    start: 0
    count: 400
    reverse: false
# Two-controller example:
#  - {host: 192.168.1.51, start: 0,   count: 200, reverse: false}
#  - {host: 192.168.1.52, start: 200, count: 200, reverse: true}

# Where photos come from: "sim" (rendered virtual photos) or "android" (IP Webcam app).
camera:
  type: sim
  url: null            # e.g. http://192.168.1.60:8080 for android

scan:
  profile: default     # scans are stored in data/scans/<profile>/
  angles: [0, 90, 180, 270]
  settle_ms: 150       # wait after lighting an LED before capturing
  brightness: 255      # 0-255 value used for the lit LED
  min_confidence: 0.3  # detections below this are discarded

sim:
  seed: null           # null = random tree each time
  tree_file: data/sim_tree.json
  host: 127.0.0.1
  port: 8765

# treemap configuration, for `treemap serve`. Every key is optional; missing keys use the
# defaults shown here. Put your own settings in config.local.yaml next to this file (git
# ignores it): it's read instead of this one when it exists. Relative paths are resolved
# against the directory containing the file.
#
# There are no LED controllers here: add them on the server's page. Each one's LED count
# is read from its WLED.

# The shape a device's map has until a scan says otherwise (the scan page picks it for
# each scan): "tree" (wound round a tree, mapped in 3D) or "flat" (laid on the floor or
# taped to a wall, mapped in 2D).
shape: tree

# Scanning: every LED flashes its own colour code while you walk round the tree with the
# phone. Each round flashes for round_s, solves, then shows the result on the LEDs (green
# ok, yellow interpolated, red failed) until you start the next round on the phone.
scan:
  profile: default     # each device's rounds are kept in data/devices/<id>/scans/<profile>/
  symbol_ms: 150       # how long each colour of the code shows
  brightness: 160      # 0-255 while flashing; lower stops the camera clipping colours
  round_s: 12          # seconds of flashing per round
  status_s: 4          # seconds a round's result shows, when the scan doesn't wait for
                       # you to start the next round on the phone
  max_rounds: 10       # stop after this many rounds (or once every LED is ok)
  countdown_s: 5       # seconds to point the camera at the LEDs before a scan starts
  fov_deg: 65          # the phone camera's horizontal field of view; a starting guess the
                       # solve refines

# Effects engine: one per device.
engine:
  fps: 40              # frames per second sent to the LEDs
  brightness: 0.8      # 0-1, scales every effect; also limits power draw
  crossfade: 0.6       # seconds to blend when switching effects
  gamma: null          # null = 2.2 (LEDs are linear: without it, fades look too bright;
                       # the virtual WLED, a screen, gets 1). Lower it if dim colours look
                       # too dark.

# The server: its page, and the API the phone's scan page uses, on the local network.
server:
  host: 0.0.0.0        # every network interface, so the phone can reach it
  port: 8765
  origins:             # web pages allowed to use it from a browser; "*" allows any
    - https://treemap-scan.pages.dev   # the scan page
    - https://treemap-spike.pages.dev
    - http://localhost:5173            # the scan page in development (scanapp/)
  scan_page: https://treemap-scan.pages.dev  # what the server's QR codes open on the phone

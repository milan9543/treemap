# treemap configuration. Every key is optional; missing keys use the defaults shown here.
# Relative paths are resolved against the directory containing this file.

# The number of LEDs isn't set here: in the simulator it's the simulated tree's (generate
# one in the viewer's Tree step or from sim.strips below), on the real tree it's where the
# last controller's LEDs end.

# What the LEDs are on: "tree" (wound round a tree, mapped in 3D) or "flat" (laid on the
# floor or taped to a wall, mapped in 2D; "up" is up in the phone's picture).
shape: tree

# Where colours go: "sim" (browser viewer) or "wled" (DDP over UDP to the controllers below).
output: sim

# WLED controllers. Each one owns a contiguous slice [start, start + count) of the global
# LED index; between them they cover every LED from 0, without gaps. "reverse" flips the
# order within that slice (strand wired from the other end). host is the controller's
# name or IP address; use the IP if the .local name doesn't resolve. `treemap wled check`
# checks each one's WLED settings against this.
controllers:
  - host: wled-tree.local
    start: 0
    count: 400
    reverse: false
# Two-controller example:
#  - {host: 192.168.1.51, start: 0,   count: 200, reverse: false}
#  - {host: 192.168.1.52, start: 200, count: 200, reverse: true}

# Where the scan's video comes from: "sim" (the viewer's virtual phone: walk round the
# tree with WASD and the mouse) or "android" (the IP Webcam app's stream, at the address
# it shows on the phone's screen). `treemap camera check` checks it can scan.
camera:
  type: sim
  url: null            # e.g. http://192.168.1.60:8080 for android
  fov_deg: 65          # horizontal field of view; a starting guess the solve refines

# Scanning: every LED flashes its own colour code while you walk round the tree. Each
# round flashes for round_s, solves, then shows the result on the tree for status_s
# (green ok, yellow interpolated, red failed) before the next round.
scan:
  profile: default     # rounds are stored in data/scans/<profile>/
  symbol_ms: 150       # how long each colour of the code shows
  brightness: 160      # 0-255 while flashing; lower stops a real camera clipping colours
  round_s: 12          # seconds of flashing per round
  status_s: 4          # seconds of status colours between rounds
  max_rounds: 10       # stop after this many rounds (or once every LED is ok)
  camera_fps: 24       # photos per second the viewer's virtual phone sends
  countdown_s: 5       # seconds to point the camera at the LEDs before a scan starts

# Effects engine (treemap run, and the viewer's Effects panel).
engine:
  fps: 40              # frames per second sent to the LEDs
  brightness: 0.8      # 0-1, scales every effect; also limits power draw
  crossfade: 0.6       # seconds to blend when switching effects
  gamma: null          # null = 1 in the simulator, 2.2 on WLED (LEDs are linear: without it,
                       # fades look too bright). Lower it if dim colours look too dark.

# The simulated tree (also editable in the viewer's Tree panel). null = random.
sim:
  seed: null           # null = random tree each time
  # LED strips in index order, for `treemap sim new` and the viewer's Tree form defaults.
  #   length: metres of strip; LED spacing = length / leds (null = random 6.5-8 cm)
  #   start:  where index 0 is: bottom | top | auto (auto = sometimes top, if quirks)
  strips:
    - {leds: 200, length: null, start: auto}
    - {leds: 200, length: null, start: auto}
  height: null         # metres; null = random 1.5-2.2
  radius: null         # metres at the base; null = random 0.5-0.8
  layout: auto         # interleaved (strips wound side by side, sharing the gaps between
                       # turns) | stacked (each strip carries on where the last one ended)
                       # | auto (auto = sometimes stacked, if quirks)
  quirks: true         # let "auto" settings pick wiring quirks at random
  hidden_leds: null    # LEDs the virtual phone never sees, e.g. "57, 120-127", to try out
                       # show-mapping and fix on bad LEDs
  tree_file: data/sim_tree.json
  host: 127.0.0.1
  port: 8765
